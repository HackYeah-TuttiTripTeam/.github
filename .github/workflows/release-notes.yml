name: Release notes

# Reusable Release Drafter flow for every TuttiTrip repo. Each repo calls it
# from .github/workflows/release-notes.yml on push to develop/main and on
# pull_request. Config: .github/release-drafter.yml in this repository.
#
# - pull_request: the autolabeler sets type:* (and release) from the PR title.
# - push to develop: updates the draft release of the next version, so the
#   notes fill in with every merged PR.
# - push to main from a merged develop -> main PR: publishes that draft and
#   tags main. Other pushes to main (hotfixes) leave the draft alone.
# - Until the first release exists, notes start at the repo's first commit
#   and the version is v0.1.0.
#
# Runs on the org's self-hosted runners and checks out no code.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  autolabel:
    name: autolabel
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, hackathon]
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: release-drafter/release-drafter/autolabeler@72967cdc98ddd3160f1fc3dff619de365e137dd0 # v7.9.0
        with:
          config-name: HackYeah-TuttiTripTeam/.github:release-drafter.yml

  draft:
    name: draft
    if: github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main')
    runs-on: [self-hosted, hackathon]
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: release-notes-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Plan
        id: plan
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = context.ref.replace('refs/heads/', '');
            let publish = false;
            if (branch === 'main') {
              const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: context.sha });
              const release = prs.find((p) => p.merged_at && p.base.ref === 'main' && p.head.ref === 'develop');
              if (!release) {
                core.info('Push to main without a merged develop -> main PR: nothing to publish.');
                core.setOutput('skip', 'true');
                return;
              }
              core.info(`Release PR #${release.number}: publishing the draft.`);
              publish = true;
            }
            core.setOutput('publish', String(publish));
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            if (!releases.some((r) => !r.draft && !r.prerelease)) {
              const commits = await github.paginate(github.rest.repos.listCommits, { owner, repo, sha: context.sha, per_page: 100 });
              core.info(`No published release yet: notes start at ${commits.at(-1).sha}, version 0.1.0.`);
              core.setOutput('from', commits.at(-1).sha);
              core.setOutput('version', '0.1.0');
            }
      - uses: release-drafter/release-drafter@72967cdc98ddd3160f1fc3dff619de365e137dd0 # v7.9.0
        if: steps.plan.outputs.skip != 'true'
        with:
          config-name: HackYeah-TuttiTripTeam/.github:release-drafter.yml
          publish: ${{ steps.plan.outputs.publish }}
          from: ${{ steps.plan.outputs.from }}
          version: ${{ steps.plan.outputs.version }}
