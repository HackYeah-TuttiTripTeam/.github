name: Dokumentacja (docs)
description: README, AGENTS.md, opisy API i inne teksty.
title: "docs: "
labels: ["type:docs"]
type: Task
projects: ["HackYeah-TuttiTripTeam/1"]
body:
  - type: markdown
    attributes:
      value: |
        Tytuł zostaw z prefiksem `docs: ` i dopisz krótki opis, np. `docs(backend): Opisać zmienne środowiskowe workera`.
        Zgłoszenia bez wymaganych sekcji są automatycznie zamykane.
  - type: textarea
    id: description
    attributes:
      label: Opis
      description: Co trzeba opisać albo poprawić i gdzie.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Dlaczego
      description: Po co to robimy i dlaczego teraz.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Kryteria akceptacji
      description: Sprawdzalna lista. Każdy punkt jako `- [ ]` albo w formie Given/When/Then.
      placeholder: |
        - [ ] Given lista wyjazdów, When wybiorę zakres dat, Then widzę tylko wyjazdy z tego zakresu
        - [ ] Pusty wynik pokazuje komunikat "Brak wyjazdów"
    validations:
      required: true
  - type: textarea
    id: dod
    attributes:
      label: Definition of Done
      description: Domyślna lista. Usuń punkty, które nie dotyczą zadania, albo dopisz własne.
      value: |
        - [ ] Polecenia i linki z tekstu sprawdzone
        - [ ] PR po review (albo self-review) i zmergowany do `develop`
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Obszar
      description: Której części projektu dotyczy zgłoszenie (można wybrać kilka).
      multiple: true
      options:
        - Frontend
        - Backend
        - Worker
        - Infra
        - Design
        - Pitch
    validations:
      required: true
