name: Nowa funkcja (feat)
description: Nowa funkcja albo zmiana zachowania aplikacji.
title: "feat: "
labels: ["type:feat"]
type: Feature
projects: ["HackYeah-TuttiTripTeam/1"]
body:
  - type: markdown
    attributes:
      value: |
        Tytuł zostaw z prefiksem `feat: ` i dopisz krótki opis, np. `feat(frontend): Filtrowanie wyjazdów po dacie`.
        Zgłoszenia bez wymaganych sekcji są automatycznie zamykane.
  - type: textarea
    id: description
    attributes:
      label: Opis
      description: Co ma powstać. Jedno, dwa zdania z perspektywy użytkownika.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Dlaczego
      description: Jaki problem rozwiązuje albo jaką wartość daje użytkownikowi i dlaczego teraz.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Kryteria akceptacji
      description: Sprawdzalna lista. Każdy punkt jako `- [ ]` albo w formie Given/When/Then.
      placeholder: |
        - [ ] Given lista wyjazdów, When wybiorę zakres dat, Then widzę tylko wyjazdy z tego zakresu
        - [ ] Pusty wynik pokazuje komunikat "Brak wyjazdów"
    validations:
      required: true
  - type: textarea
    id: dod
    attributes:
      label: Definition of Done
      description: Domyślna lista. Usuń punkty, które nie dotyczą zadania, albo dopisz własne.
      value: |
        - [ ] CI zielone (lint, typy, testy, testy architektury)
        - [ ] Testy dla nowej logiki
        - [ ] PR po review (albo self-review) i zmergowany do `develop`
        - [ ] Działa na wdrożeniu develop
        - [ ] Zaktualizowane docs / AGENTS.md, jeśli trzeba
        - [ ] UI: audyt impeccable i sprawdzenie na telefonie
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Poza zakresem
      description: Opcjonalnie. Czego to zadanie świadomie nie obejmuje.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Obszar
      description: Której części projektu dotyczy zgłoszenie (można wybrać kilka).
      multiple: true
      options:
        - Frontend
        - Backend
        - Worker
        - Infra
        - Design
        - Pitch
    validations:
      required: true
